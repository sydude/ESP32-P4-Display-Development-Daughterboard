name: current-pass-audit
on:
  push:
    branches: [work/current-pass-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture baseline design files
        run: |
          mkdir -p audit-output/baseline
          cp "hardware/kicad/ESP32-P4 Display Development Daughterboard.kicad_sch" audit-output/baseline/root.kicad_sch
          cp "hardware/kicad/ESP32-P4 Display Development Daughterboard.kicad_pcb" audit-output/baseline/board.kicad_pcb
          cp "hardware/kicad/Phase2.kicad_sym" audit-output/baseline/Phase2.kicad_sym
          cp hardware/BOM.csv audit-output/baseline/BOM.csv
      - uses: actions/upload-artifact@v4
        with:
          name: current-pass-baseline
          path: audit-output/baseline/
